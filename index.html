<!DOCTYPE html>
<html lang="ru">
    <head>
        <title>DreamLand MUD - Мир Грёз, текстовая онлайн рпг на фентезийную тематику</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, shrink-to-fit=no">
        <meta name="Description" content="DreamLand MUD (Мир Грез, Мир Снов, Dream Land, МУД, МАД) текстовая многопользовательская ролевая онлайн игра на тематику фентези">

        <!-- Fatal-load reporter: if an uncaught error/rejection leaves #root empty (a blank
             client, e.g. an old mobile WebKit choking on the bundle), surface the message
             on-screen instead of a silent blank. Delayed 1.5s so a transient handled error
             on an otherwise-working client never clobbers a rendered app. -->
        <script>
        (function () {
          var lastErr = null;
          function rootEmpty() { var r = document.getElementById('root'); return !r || r.childElementCount === 0; }
          function record(msg) {
            lastErr = msg;
            setTimeout(function () {
              if (!rootEmpty() || !lastErr) return;
              try {
                var d = document.getElementById('fatal-error');
                if (!d) {
                  d = document.createElement('pre');
                  d.id = 'fatal-error';
                  d.style.cssText = 'white-space:pre-wrap;word-break:break-word;padding:14px;margin:0;color:#ff8080;background:#161616;font:13px/1.45 monospace;position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;overflow:auto';
                  (document.body || document.documentElement).appendChild(d);
                }
                d.textContent = 'DREAMLAND CLIENT FAILED TO LOAD\n\n' + lastErr;
              } catch (_) {}
            }, 1500);
          }
          window.addEventListener('error', function (e) {
            var err = e.error;
            // WebKit stacks omit the error name/message, so capture them explicitly.
            var head = err && (err.name || err.message)
              ? (err.name || 'Error') + ': ' + (err.message || '')
              : (e.message || 'Unknown error');
            var loc = err && err.stack ? err.stack
              : (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0);
            record(head + '\n' + loc);
          });
          window.addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            record('UnhandledRejection: ' + (r && r.stack ? r.stack : (r && r.message ? r.message : String(r))));
          });
        })();
        </script>

        <!-- Boot screen + critical hiding. The skin's CSS (which carries `.modal
             { display:none }`) is a DYNAMIC import in main.js, so it applies only
             after the first paint. Until then the static modals below would flash
             as unstyled text on a white page. These few rules paint the obsidian
             ground and keep the modals hidden from the very first frame, and
             #dl-boot (a spinner over black) covers everything until main.js drops it
             once the skin has loaded. Kept just under the fatal-error reporter
             (z 99999) so a failed load still surfaces above the spinner. -->
        <style>
          html, body { margin: 0; background: #0b0a0f; }
          .modal { display: none; }
          #dl-boot {
            position: fixed; inset: 0; z-index: 99990;
            display: flex; align-items: center; justify-content: center;
            background: #0b0a0f; transition: opacity 0.35s ease;
          }
          #dl-boot.gone { opacity: 0; pointer-events: none; }
          .dl-boot-spin {
            width: 44px; height: 44px; border-radius: 50%;
            border: 3px solid rgba(198, 162, 78, 0.18);
            border-top-color: #c6a24e;
            animation: dl-boot-spin 0.9s linear infinite;
          }
          @keyframes dl-boot-spin { to { transform: rotate(360deg); } }
          @media (prefers-reduced-motion: reduce) {
            .dl-boot-spin { animation: none; }
          }
        </style>

        <!-- one monospace, Fira Code (Cyrillic + Latin), fetched globally so both skins get it -->
        <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap" rel="stylesheet" />
        <!-- Cyborg (Bootstrap 4 dark) removed for the Runeforge build; runeforge.css owns the visual layer -->

        <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" />
    </head>
    <body>
        
    
        <div id="dl-boot" aria-hidden="true"><div class="dl-boot-spin"></div></div>
        <div id="rpc-events"></div>
        <div id="root"></div>
        
        <div id="settings-root"></div>

        <div id="textedit-modal" class="webeditor modal fade" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-body">
                        <input style="display:none;" type="text" class="form-control" placeholder="Быстрый поиск по справке">
                        <div class="editor"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="cancel-button btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="button" class="save-button btn btn-primary" data-dismiss="modal">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="cs-modal" class="webeditor modal fade" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-body">
                        <div class="form-group">
                            <input id="cs-subject" class="form-control" placeholder="Subject" required="true"/>
                            <ul id="editor-tabs" class="nav nav-tabs">
                     <!-- вкладки будут добавляться как <li><a></a></li> -->
                            </ul>   
                            <div class="editor"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="cancel-button btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="button" class="run-button btn btn-primary" data-dismiss="modal">Run</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="triggers">
            <div class="trigger"></div>
        </div>
    <script type="module" src="/src/index.jsx"></script>
    </body>
</html>
